name: Build unsigned IPA

# Windows-only development loop:
#   push  ->  this builds an unsigned .ipa on a macOS runner
#         ->  download the artifact
#         ->  sideload from Windows with Sideloadly / AltServer / iPASide,
#             signing with your free Apple ID
#
# Public repo, so macOS runner minutes are unlimited and free. On a private
# repo these would burn the 10x multiplier (~200 macOS minutes/month on the
# free tier), which is why the repo is public.
#
# This produces a build. It cannot run M0 — the four gates need thermals,
# battery and memory on your actual phone, under lock. See docs/M0-RUNBOOK.md;
# the app measures itself and writes the report to Files.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # only used by the release step on a tag

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # iOS 26 deployment target needs Xcode 26+. macos-latest has it, but pin
      # explicitly so a runner image change does not silently move the SDK
      # under a project whose whole design is version-sensitive.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Stamp the build so a crash log identifies its own commit.
      #
      # Both earlier crash reports said `app_version: 0.1.0`, so telling "did
      # the fix ship?" from "does the fix work?" meant comparing binary UUIDs
      # and byte sizes. That cost a whole round trip. CFBundleVersion appears
      # in every .ips, so put the run number and the short SHA in it.
      - name: Stamp build version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD="${{ github.run_number }}+${SHORT_SHA}"
          echo "Stamping CFBundleVersion = $BUILD"
          for plist in Gabbro/Info.plist GabbroWidgets/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$plist"
          done
          echo "BUILD_STAMP=$BUILD" >> $GITHUB_ENV
          # Filename-safe variant. The .ipa files are named with this so a
          # download cannot silently overwrite a different build -- which is
          # exactly what happened: two .ipas both called
          # Gabbro-no-extension.ipa, and an older build got sideloaded and
          # debugged for a round.
          echo "FILE_STAMP=b${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_ENV

      # Surfaced as its own step so a dependency resolution failure reads as
      # "the package moved" rather than a compile error 20 lines into a build
      # log. WhisperKit's repo has already moved once (argmaxinc/WhisperKit ->
      # argmaxinc/argmax-oss-swift), so this is not hypothetical.
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Gabbro.xcodeproj \
            -scheme Gabbro
          echo "--- resolved ---"
          cat Gabbro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true

      # Print the dependency's REAL public API from the checked-out source.
      #
      # Learned the hard way: a build written against FluidAudio's published
      # docs failed on every single signature, because those docs described
      # `main` while the package was pinned to a tag. The source is right here
      # on the runner. Read it instead of guessing.
      - name: Dump WhisperKit public API
        run: |
          SRC=$(find build/SourcePackages/checkouts -maxdepth 3 -type d -name WhisperKit -path "*Sources*" | head -1)
          if [ -z "$SRC" ]; then
            echo "::warning::WhisperKit checkout not found; skipping API dump"
            ls -1 build/SourcePackages/checkouts 2>/dev/null || true
            exit 0
          fi
          echo "### WhisperKit public API (as checked out)" >> $GITHUB_STEP_SUMMARY
          echo '```swift' >> $GITHUB_STEP_SUMMARY
          grep -rhn -E "^\s*public (final )?(actor|class|struct|enum|protocol|init|func|var|let)"             "$SRC" 2>/dev/null | sed 's/^[0-9]*://' | sort -u | head -200 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "--- TranscriptionResult / TranscriptionSegment / WordTiming ---"
          grep -rn -A25 "public struct TranscriptionResult\|open class TranscriptionResult\|public struct TranscriptionSegment\|public struct WordTiming"             "$SRC/Core/Models.swift" 2>/dev/null | head -120 || true
          echo "--- DecodingOptions ---"
          grep -rn -A40 "public struct DecodingOptions" "$SRC/Core/Models.swift" 2>/dev/null | head -60 || true

      # Unsigned. Signing happens on Windows, at sideload time, with your free
      # Apple ID — the CI runner has no certificate and does not need one.
      # CODE_SIGNING_ALLOWED=NO must also apply to the widget extension, which
      # is why it is set at the xcodebuild level rather than per target.
      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Gabbro.xcodeproj \
            -scheme Gabbro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # An .ipa is a zip with the .app inside a Payload/ directory. That is the
      # whole format; no export options plist is needed for an unsigned build.
      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Gabbro.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::$APP_PATH not found. Products:"
            ls -la build/Build/Products/Release-iphoneos/ || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "Gabbro-${FILE_STAMP}.ipa" Payload
          echo "--- ipa ---"
          ls -lh "Gabbro-${FILE_STAMP}.ipa"
          echo "--- embedded binaries ---"
          ls -la Payload/Gabbro.app/PlugIns/ 2>/dev/null || echo "(no PlugIns — widget extension did not embed)"

      # The widget extension carries the Control Center button and the Live
      # Activity. A Live Activity is mandatory for the AudioRecordingIntent
      # path: without it iOS stops the recording. So a missing extension is a
      # broken build, not a cosmetic gap — fail loudly rather than shipping an
      # .ipa that cannot record from the Lock Screen.
      - name: Verify widget extension embedded
        run: |
          if [ ! -d "Payload/Gabbro.app/PlugIns/GabbroWidgets.appex" ]; then
            echo "::error::GabbroWidgets.appex is not embedded. The Live Activity is mandatory for AudioRecordingIntent; iOS stops recordings without one."
            exit 1
          fi
          echo "GabbroWidgets.appex embedded OK"

      # A second .ipa with PlugIns/ stripped, from the same build. Free.
      #
      # CI ships the appex unsigned (CODE_SIGNING_ALLOWED=NO), so the sideload
      # tool has to re-sign it. When it signs the host app and leaves the
      # extension bare, the appex gets codeSigningTrustLevel 0 and the kernel
      # kills it on its first code page-in: CODESIGNING / "Invalid Page",
      # ~3 ms after launch. Each extension also consumes one of the 10 App IDs
      # a free Apple ID gets per 7 days, which is why tools drop them.
      #
      # M0's four gates do not need the extension -- the in-app record button
      # does not go through AudioRecordingIntent -- so this variant unblocks
      # measurement while the appex signing gets sorted separately. What you
      # lose: the Live Activity, the Control Center button, and therefore the
      # locked-screen start and Lock Screen stop paths.
      - name: Package no-extension variant
        run: |
          rm -rf NoExt && mkdir -p NoExt
          cp -R Payload NoExt/Payload
          rm -rf NoExt/Payload/Gabbro.app/PlugIns
          (cd NoExt && zip -qry "../Gabbro-${FILE_STAMP}-no-extension.ipa" Payload)
          ls -lh "Gabbro-${FILE_STAMP}-no-extension.ipa"
          shasum -a 256 "Gabbro-${FILE_STAMP}-no-extension.ipa"             | tee "Gabbro-${FILE_STAMP}-no-extension.ipa.sha256"

      # Windows antivirus will often flag this download: a nested archive
      # around an unsigned, zero-reputation executable is textbook heuristic
      # bait, even though an iOS arm64 Mach-O cannot run on Windows at all.
      # "Trust the build" is not verification, so every run publishes the
      # checksum and a full manifest of what is inside. Compare the SHA256 of
      # what you downloaded against this before deciding anything.
      - name: Checksum and manifest
        run: |
          echo "### Verify this build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build stamp (appears as \`app_version\`/build in any crash log): \`${BUILD_STAMP}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Two variants are published: the full app, and one with the widget extension" >> $GITHUB_STEP_SUMMARY
          echo "stripped for when the appex will not sign. SHA256 of \`Gabbro.ipa\` as built:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          shasum -a 256 "Gabbro-${FILE_STAMP}.ipa" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "On Windows: \`certutil -hashfile Gabbro-${FILE_STAMP}.ipa SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Everything inside the .ipa</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -l "Gabbro-${FILE_STAMP}.ipa" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          shasum -a 256 "Gabbro-${FILE_STAMP}.ipa" > "Gabbro-${FILE_STAMP}.ipa.sha256"
          echo "--- linked libraries (nothing should be unexpected) ---"
          otool -L Payload/Gabbro.app/Gabbro | head -40

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Gabbro-unsigned-${{ github.sha }}
          path: |
            Gabbro-*.ipa
            Gabbro-*.ipa.sha256
          retention-days: 30
          if-no-files-found: error

      # A release asset is a plain public HTTPS URL, so the phone can fetch the
      # build directly from Safari or SideStore. That keeps the binary off the
      # Windows machine entirely -- which matters when that machine is
      # centrally managed and its browser blocks unsigned, zero-reputation
      # downloads by policy. Nothing is bypassed; the file simply never needs
      # to go there.
      #
      # Tag a build to publish one:  git tag v0.1.1 && git push --tags
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Gabbro-*.ipa
            Gabbro-*.ipa.sha256
          generate_release_notes: true
          body: |
            Unsigned build for personal sideloading. Sign it yourself with a free Apple ID.

            **Two variants.** `Gabbro.ipa` is the full app. `Gabbro-no-extension.ipa` has the
            widget extension stripped -- use it if the appex fails to sign and gets killed with
            CODESIGNING / "Invalid Page". You lose the Live Activity, the Control Center button,
            and the locked-screen start/stop paths. Everything else, including all four M0
            gates, works without it.

            **Install straight onto the phone** (no desktop involved): open this page in
            Safari on the iPhone, download `Gabbro.ipa`, then open it in SideStore or
            AltStore. Or paste the asset URL into SideStore's install-from-URL field.

            Expires 7 days after signing. Re-sign, or let SideStore refresh on-device.

            The SHA256 is in `Gabbro.ipa.sha256` and in this run's build summary.

      - name: Sideload instructions
        run: |
          echo "### Getting this onto the phone" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preferred — phone only, no desktop:** tag a build (\`git tag v0.1.1 && git push --tags\`)," >> $GITHUB_STEP_SUMMARY
          echo "then open the Releases page in Safari on the iPhone and install the \`.ipa\` with" >> $GITHUB_STEP_SUMMARY
          echo "SideStore or AltStore. A release asset is a plain public URL, so a managed desktop" >> $GITHUB_STEP_SUMMARY
          echo "never has to handle the binary." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Via desktop:** download **Gabbro-unsigned-${{ github.sha }}** above, unzip," >> $GITHUB_STEP_SUMMARY
          echo "install with Sideloadly / AltServer / iPASide. Expect the browser to flag an" >> $GITHUB_STEP_SUMMARY
          echo "unsigned zero-reputation binary; verify the SHA256 above rather than shrugging." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "M0 measurements come off the phone via **Files -> On My iPhone -> Gabbro -> Diagnostics**. See \`docs/M0-RUNBOOK.md\`." >> $GITHUB_STEP_SUMMARY
