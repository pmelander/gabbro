name: Gabbro
options:
  bundleIdPrefix: com.pmelander
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode with targeted concurrency checking, deliberately.
    # This scaffold was authored on Windows and has never been compiled. Swift 6
    # strict concurrency would bury the first build on a Mac in actor-isolation
    # diagnostics that say nothing about whether the design works. Get it green,
    # get M0 measured, THEN raise to 6.0 / complete — the concurrency boundaries
    # (JobStore actor, @MainActor recorder, nonisolated tap callback) are already
    # drawn for it.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Free personal team: leave DEVELOPMENT_TEAM empty and let Xcode pick it,
    # or set it here once you know your team id. Automatic signing works with
    # a free Apple ID; see README "Signing".
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1" # iPhone only. iPad is a non-goal.

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    # Pinned deliberately. FluidAudio is pre-1.0 and churning; see
    # docs/designs/voice-capture-obsidian-ios.md M0 step 1.
    exactVersion: 0.15.6

targets:
  Gabbro:
    type: application
    platform: iOS
    sources:
      - path: Gabbro
        excludes:
          - "**/.DS_Store"
      - path: Shared
    dependencies:
      - package: FluidAudio
      - target: GabbroWidgets
        embed: true
    info:
      path: Gabbro/Info.plist
      properties:
        CFBundleDisplayName: Gabbro
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          Gabbro records your voice and transcribes it on this device. Audio never
          leaves your phone.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Recovery affordance: exposes Documents/ in the Files app so retained
        # audio and rendered markdown can always be retrieved by hand, even if
        # the share path misbehaves. Two keys, zero code.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # net.daringfireball.markdown is a THIRD-PARTY UTI, not system-declared.
        # Without this import a .md file URL resolves to a dynamic UTI or
        # public.plain-text and the share sheet takes a different branch.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmelander.gabbro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # NOTE: no App Group. Free personal-team provisioning cannot sign one,
        # and the design deliberately avoids needing it (stateless control
        # button + Live Activity for state). Do not add one back without
        # re-reading the Distribution Plan.

  GabbroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GabbroWidgets
      - path: Shared
    info:
      path: GabbroWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gabbro Widgets
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmelander.gabbro.widgets
        SKIP_INSTALL: YES

schemes:
  Gabbro:
    build:
      targets:
        Gabbro: all
    run:
      config: Debug
    archive:
      config: Release
