name: Gabbro
options:
  bundleIdPrefix: com.pmelander
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode with targeted concurrency checking, deliberately.
    # This scaffold was authored on Windows and has never been compiled. Swift 6
    # strict concurrency would bury the first build on a Mac in actor-isolation
    # diagnostics that say nothing about whether the design works. Get it green,
    # get M0 measured, THEN raise to 6.0 / complete — the concurrency boundaries
    # (JobStore actor, @MainActor recorder, nonisolated tap callback) are already
    # drawn for it.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Free personal team: leave DEVELOPMENT_TEAM empty and let Xcode pick it,
    # or set it here once you know your team id. Automatic signing works with
    # a free Apple ID; see README "Signing".
    CODE_SIGN_STYLE: Automatic
    # Keep the linker from folding identical functions together.
    #
    # Three crash reports pointed at `TranscriptionCoordinator.drain(job:) + 132`
    # with the offset unchanged across three different bodies, and carried
    # `<deduplicated_symbol>` frames. Identical code folding makes a backtrace
    # name whichever symbol sorted first, not the function that actually ran.
    # A slightly larger binary is worth a backtrace that does not lie, and this
    # loop has no debugger to fall back on.
    OTHER_LDFLAGS: -Wl,-no_deduplicate
    TARGETED_DEVICE_FAMILY: "1" # iPhone only. iPad is a non-goal.

packages:
  # WhisperKit, not FluidAudio.
  #
  # FluidAudio only wraps Parakeet and Nemotron, and Parakeet v3's language set
  # is the EU official languages plus Russian and Ukrainian -- so no Norwegian,
  # which is a hard requirement here. Whisper covers no/nb, sv, da, en and ~95
  # more.
  #
  # The package moved: argmaxinc/WhisperKit's own README now points at
  # argmax-oss-swift, which is what this follows. If resolution fails, the
  # alternative is https://github.com/argmaxinc/WhisperKit.git.
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 0.9.0

targets:
  Gabbro:
    type: application
    platform: iOS
    sources:
      - path: Gabbro
        excludes:
          - "**/.DS_Store"
      - path: Shared
    dependencies:
      - package: WhisperKit
      - target: GabbroWidgets
        embed: true
    info:
      path: Gabbro/Info.plist
      properties:
        CFBundleDisplayName: Gabbro
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          Gabbro records your voice and transcribes it on this device. Audio never
          leaves your phone.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Recovery affordance: exposes Documents/ in the Files app so retained
        # audio and rendered markdown can always be retrieved by hand, even if
        # the share path misbehaves. Two keys, zero code.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # net.daringfireball.markdown is a THIRD-PARTY UTI, not system-declared.
        # Without this import a .md file URL resolves to a dynamic UTI or
        # public.plain-text and the share sheet takes a different branch.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmelander.gabbro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # NOTE: no App Group. Free personal-team provisioning cannot sign one,
        # and the design deliberately avoids needing it (stateless control
        # button + Live Activity for state). Do not add one back without
        # re-reading the Distribution Plan.

  GabbroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GabbroWidgets
      - path: Shared
    info:
      path: GabbroWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gabbro Widgets
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmelander.gabbro.widgets
        SKIP_INSTALL: YES

schemes:
  Gabbro:
    build:
      targets:
        Gabbro: all
    run:
      config: Debug
    archive:
      config: Release
